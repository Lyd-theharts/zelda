@if (treasureList()) {
  <div class="container">
    <div class="row">


      @for (treasure of treasureList(); track treasure.id) {
        <div class="col-4" [routerLink]="'/treasure-detail/' + treasure.id">
          <div class="card bg-success my-3">
            <div class="card-header">
              <h3 class="text-white">{{ treasure.name }}</h3>
            </div>
            <div class="card-body text-center">
              <img [src]="treasure.image" [alt]="treasure.name" class="img-fluid">
            </div>
          </div>
        </div>
      }

    </div>
  </div>
} @else {
  <div class="loading-container">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
}

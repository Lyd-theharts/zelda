@if (monsterList()) {
  <div class="container">
    <div class="row">

      <ngb-pagination
        [collectionSize]="collectionSize()"
        [(page)]="page"
        [pageSize]="pageSize"
        (pageChange)="refreshCards()"
        [maxSize]="5"
        [boundaryLinks]="true"
        aria-label="Paginación de cartas">
      </ngb-pagination>

      @for (monster of displayedCards(); track monster.id) {
        <div class="col-4" [routerLink]="'/monster-detail/' + monster.id">
          <div class="card bg-success my-3">
            <div class="card-header">
              <h3 class="text-white">{{ monster.name }}</h3>
            </div>
            <div class="card-body text-center">
              <img [src]="monster.image" [alt]="monster.name" class="img-fluid">
            </div>
          </div>
        </div>
      }

    </div>
  </div>
} @else {
  <div class="loading-container">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
}
